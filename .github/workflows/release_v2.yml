# Builds native macOS binaries on each `vX.Y.Z` tag, publishes a checksummed
# GitHub Release, and bumps a Homebrew *cask* in senecal-jjs/homebrew-tools.
#
# This is the prebuilt-binary path (fast installs) and pairs with a CASK, not the
# source `Formula/rfm.rb`. Pick one distribution model per tap entry.
#
# One-time setup:
#   - Commit Cargo.lock (the build uses --locked).
#   - Add a repo secret HOMEBREW_TAP_TOKEN: a PAT (or fine-grained token) with
#     contents:write on senecal-jjs/homebrew-tools, so this repo can push there.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create releases + upload assets in THIS repo

env:
  BIN: rfm

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14 # Apple Silicon runner (native arm64)
          - target: x86_64-apple-darwin
            os: macos-15-intel # Intel runner (native x86_64)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: \${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: \${{ matrix.target }}

      # Native builds avoid cross-compiling the C crypto deps (aws-lc-sys).
      - name: Build
        run: cargo build --release --locked --target \${{ matrix.target }} -p mirror-cli

      # FIX 1: Ad-hoc sign the compiled binary before packaging
      - name: Ad-hoc Sign Binary
        run: |
          codesign --force --deep --sign - "target/ matrix.target /release/{BIN}"

      - name: Package
        run: |
          set -euo pipefail
          staging="pkg"
          mkdir -p "\$staging"
          cp "target/\${{ matrix.target }}/release/BIN" "staging/"
          asset="\${BIN}-\({GITHUB_REF_NAME}-\){{ matrix.target }}.tar.gz"
          # Tar the bare binary at the archive root so the cask's `binary "rfm"` works.
          tar -czf "\$asset" -C "staging" "{BIN}"
          shasum -a 256 "\$asset" | awk '{print 1' > "asset.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: \${{ matrix.target }}
          path: |
            \${{ env.BIN }}-*.tar.gz
            \${{ env.BIN }}-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256

  bump-cask:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: senecal-jjs/homebrew-tools
          token: \${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Regenerate the cask
        run: |
          set -euo pipefail
          version="\${GITHUB_REF_NAME#v}"
          arm_sha="\$(cat artifacts/BIN-{GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz.sha256)"
          intel_sha="\$(cat artifacts/BIN-{GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz.sha256)"

          mkdir -p tap/Casks
          cat > tap/Casks/\${BIN}.rb <<EOF
          cask "\${BIN}" do
            arch arm: "aarch64", intel: "x86_64"

            version "\${version}"
            sha256 arm:   "\${arm_sha}",
                   intel: "\${intel_sha}"

            url "https://github.com/senecal-jjs/rust-file-mirror/releases/download/v#{version}/\${BIN}-v#{version}-#{arch}-apple-darwin.tar.gz"
            name "rfm"
            desc "Encrypted, client-side S3 file mirror CLI and daemon"
            homepage "https://github.com/senecal-jjs/rust-file-mirror"

            binary "\${BIN}"

            # FIX 2: Clear Gatekeeper quarantine via Cask postflight hook
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{staged_path}/\${BIN}"],
                             sudo: false
            end
          end
          EOF

      - name: Commit the bump
        run: |
          set -euo pipefail
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/\${BIN}.rb
          git commit -m "rfm \${GITHUB_REF_NAME}"
          git push
