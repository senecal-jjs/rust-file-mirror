[package]
name = "backup-core"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.6"
data-encoding = "2.11.1"
fastcdc = "5.0.0"
mirror-core = { version = "0.1.0", path = "../mirror-core" }
rand = "0.9"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
zstd = "0.13"

[dev-dependencies]
proptest = "1.9.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
