[package]
name = "mirror-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = "1.10.1"
aws-sdk-s3 = "1.141.0"
blake3 = "1.8.6"
ignore = "0.4.33"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "signal", "sync"] }
toml = "1.1.4"
tracing = "0.1.44"
unicode-normalization = "0.1.25"
tempfile = "3.27.0"
tokio-util = "0.7.19"
futures-util = "0.3.34"
rand = "0.9"

[dev-dependencies]
