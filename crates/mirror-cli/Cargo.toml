[package]
name = "mirror-cli"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6.0.0"
fs2 = "0.4.3"
futures-util = "0.3.34"
indicatif = "0.18.6"
mirror-core = { version = "0.1.0", path = "../mirror-core" }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
rand = "0.9"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
rpassword = "7.5.4"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "rfm"
path = "src/main.rs"

[dev-dependencies]
insta = "1.49.0"
