[package]
name = "mirror-cli"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.6", features = ["derive", "env"] }
dirs = "6.0.0"
fs2 = "0.4.3"
indicatif = "0.18.6"
mirror-core = { version = "0.1.0", path = "../mirror-core" }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
rand = "0.9"
rpassword = "7.5.4"
secrecy = "0.10.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "rfm"
path = "src/main.rs"
